<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಅಂಕಗಣಿತದ ಉಕ್ತಿಗಳು - ಕ್ವಿಜ್</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 900px;
            width: 100%;
            padding: 30px 35px;
            transition: all 0.3s;
        }

        h1 {
            font-size: 24px;
            color: #0d47a1;
            border-bottom: 3px solid #bbdefb;
            padding-bottom: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #1565c0;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 6px;
            background: #bbdefb;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #1976d2;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            color: #212121;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .question-text .kn {
            display: block;
            font-weight: 400;
            color: #424242;
            font-size: 15px;
            margin-top: 6px;
            padding-left: 8px;
            border-left: 3px solid #90caf9;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
        }

        .option:hover {
            background: #e3f2fd;
            border-color: #64b5f6;
        }

        .option.selected {
            background: #e3f2fd;
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.2);
        }

        .option.correct {
            background: #e8f5e9;
            border-color: #43a047;
        }

        .option.wrong {
            background: #ffebee;
            border-color: #e53935;
        }

        .option input[type="radio"] {
            margin-right: 12px;
            accent-color: #1976d2;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option .opt-label {
            font-weight: 700;
            margin-right: 8px;
            color: #1565c0;
            min-width: 22px;
        }

        .explanation {
            background: #fff3e0;
            border-left: 5px solid #ef6c00;
            padding: 16px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 15px;
            line-height: 1.6;
            color: #4e342e;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .explanation strong {
            color: #bf360c;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #1976d2;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0d47a1;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.4);
        }

        .btn-success {
            background: #43a047;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #2e7d32;
            box-shadow: 0 4px 12px rgba(67, 160, 71, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #424242;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #bdbdbd;
        }

        .result-screen {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }

        .result-screen.show {
            display: block;
        }

        .result-screen h2 {
            font-size: 28px;
            color: #0d47a1;
            margin-bottom: 16px;
        }

        .result-screen .score {
            font-size: 48px;
            font-weight: 800;
            color: #1976d2;
            margin: 10px 0;
        }

        .result-screen .score span {
            font-size: 24px;
            color: #757575;
        }

        .result-screen p {
            font-size: 17px;
            color: #424242;
            margin-bottom: 24px;
        }

        .result-screen .btn {
            margin: 0 auto;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 20px 18px;
            }
            .question-text {
                font-size: 15px;
            }
            .option {
                font-size: 13px;
                padding: 10px 12px;
            }
            .btn {
                font-size: 13px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizContainer">
        <h1>🧮 ಅಂಕಗಣಿತದ ಉಕ್ತಿಗಳು - ಕ್ವಿಜ್</h1>

        <div class="progress">
            <span id="progressText">ಪ್ರಶ್ನೆ 1 / 50</span>

        </div>
        <div class="progress-bar">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>

        <div id="questionContainer">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="explanation" id="explanationBox"></div>
            <div class="btn-group">
                <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← ಹಿಂದೆ</button>
                <button class="btn btn-primary" id="checkBtn" onclick="checkAnswer()">ಉತ್ತರ ಪರಿಶೀಲಿಸಿ</button>
                <button class="btn btn-success" id="nextBtn" onclick="nextQuestion()">ಮುಂದೆ →</button>
            </div>
        </div>

        <div class="result-screen" id="resultScreen">
            <h2>🎉 ಕ್ವಿಜ್ ಪೂರ್ಣಗೊಂಡಿದೆ!</h2>

            <button class="btn btn-primary" onclick="restartQuiz()">🔄 ಮತ್ತೆ ಪ್ರಾರಂಭಿಸಿ</button>
        </div>
    </div>

                kn: "14 + (12 + 10) ಈ ಉಕ್ತಿಯನ್ನು ಆವರಣಗಳಿಲ್ಲದೆ ಸಮಾನ ಬೆಲೆ ಬರುವಂತೆ ಬರೆಯಿರಿ.",

            // Q46

                kn: "14 - (12 + 10) ಈ ಉಕ್ತಿಯನ್ನು ಆವರಣಗಳಿಲ್ಲದೆ ಸಮಾನ ಬೆಲೆ ಬರುವಂತೆ ಬರೆಯಿರಿ.",
                options: ["14 - 12 - 10", "14 + 12 + 10", "14 - 12 + 10", "14 + 12 - 10"],
                correct: 0,
                explanation: "ಆವರಣದ ಮೊದಲು ಋಣ ಚಿಹ್ನೆ ಇರುವುದರಿಂದ, ಆವರಣ ತೆಗೆದಾಗ ಒಳಗಿನ ಚಿಹ್ನೆಗಳು ಬದಲಾಗುತ್ತವೆ. <strong>14 - 12 - 10</strong>."

            // Q47
            {
                question: "(6 + 10) - 2 ಮತ್ತು 6 + (10 - 2) - ಈ ಎರಡೂ ಉಕ್ತಿಗಳ ಬೆಲೆ ಒಂದೇ ಆಗಿರುತ್ತದೆಯೇ?",
                kn: "(6 + 10) - 2 ಮತ್ತು 6 + (10 - 2) ಈ ಎರಡೂ ಉಕ್ತಿಗಳ ಬೆಲೆ ಒಂದೇ ಆಗಿರುತ್ತದೆಯೇ?",
                options: ["ಹೌದು", "ಇಲ್ಲ", "ಕೆಲವೊಮ್ಮೆ", "ನಿಖರವಾಗಿ ಹೇಳಲು ಸಾಧ್ಯವಿಲ್ಲ"],
                correct: 0,
                explanation: "(6 + 10) - 2 = 16 - 2 = 14. 6 + (10 - 2) = 6 + 8 = 14. <strong>ಹೌದು</strong>, ಎರಡೂ ಸಮ."

            // Q48
            {

                kn: "16 - (8 - 3) ಮತ್ತು (16 - 8) - 3 ಈ ಎರಡೂ ಉಕ್ತಿಗಳ ಬೆಲೆ ಒಂದೇ ಆಗಿರುತ್ತದೆಯೇ?",
                options: ["ಹೌದು", "ಇಲ್ಲ", "ಕೆಲವೊಮ್ಮೆ", "ನಿಖರವಾಗಿ ಹೇಳಲು ಸಾಧ್ಯವಿಲ್ಲ"],
                correct: 1,

            },
            // Q49
            {
                question: "27 - (18 + 4) ಮತ್ತು 27 + (-18 - 4) - ಈ ಎರಡೂ ಉಕ್ತಿಗಳ ಬೆಲೆ ಒಂದೇ ಆಗಿರುತ್ತದೆಯೇ?",
                kn: "27 - (18 + 4) ಮತ್ತು 27 + (-18 - 4) ಈ ಎರಡೂ ಉಕ್ತಿಗಳ ಬೆಲೆ ಒಂದೇ ಆಗಿರುತ್ತದೆಯೇ?",
                options: ["ಹೌದು", "ಇಲ್ಲ", "ಕೆಲವೊಮ್ಮೆ", "ನಿಖರವಾಗಿ ಹೇಳಲು ಸಾಧ್ಯವಿಲ್ಲ"],
                correct: 0,
                explanation: "27 - (18 + 4) = 27 - 22 = 5. 27 + (-18 - 4) = 27 - 22 = 5. <strong>ಹೌದು</strong>, ಎರಡೂ ಸಮ."
            },
            // Q50
            {
                question: "319 + 537, 319 - 537, -537 + 319, 537 - 319 - ಈ ಉಕ್ತಿಗಳಲ್ಲಿ ಒಂದೇ ಬೆಲೆ ಹೊಂದಿರುವ ಉಕ್ತಿಗಳು ಯಾವುವು?",
                kn: "ಕೊಟ್ಟಿರುವ ಉಕ್ತಿಗಳಲ್ಲಿ ಒಂದೇ ಬೆಲೆ ಹೊಂದಿರುವ ಉಕ್ತಿಗಳನ್ನು ಗುರುತಿಸಿ.",
                options: ["319 + 537 ಮತ್ತು -537 + 319", "319 - 537 ಮತ್ತು 537 - 319", "319 + 537 ಮತ್ತು 537 - 319", "ಎಲ್ಲಾ ವಿಭಿನ್ನ"],
                correct: 0,
                explanation: "ಸಂಕಲನದ ವಿನಿಮಯ ಗುಣದಿಂದ, <strong>319 + 537 = -537 + 319</strong>. ಉಳಿದವು ವಿಭಿನ್ನ ಬೆಲೆಗಳನ್ನು ಹೊಂದಿವೆ."
            }
        ];

        // ============================================================
        // QUIZ LOGIC
        // ============================================================
        let currentQuestion = 0;
        let score = 0;
        let answered = new Array(quizData.length).fill(false);
        let selectedAnswers = new Array(quizData.length).fill(null);

        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const explanationBox = document.getElementById('explanationBox');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const progressBarFill = document.getElementById('progressBarFill');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const checkBtn = document.getElementById('checkBtn');
        const questionContainer = document.getElementById('questionContainer');
        const resultScreen = document.getElementById('resultScreen');
        const finalScore = document.getElementById('finalScore');
        const resultMessage = document.getElementById('resultMessage');

        function renderQuestion() {
            const q = quizData[currentQuestion];
            questionText.innerHTML = `<strong>${currentQuestion + 1}.</strong> ${q.question} <span class="kn">${q.kn}</span>`;

            // Render options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                if (selectedAnswers[currentQuestion] === index) {
                    div.classList.add('selected');
                }
                if (answered[currentQuestion]) {
                    if (index === q.correct) {
                        div.classList.add('correct');
                    } else if (selectedAnswers[currentQuestion] === index && index !== q.correct) {
                        div.classList.add('wrong');
                    }
                }

                div.innerHTML = `
                    <input type="radio" name="q${currentQuestion}" value="${index}" 
                        ${selectedAnswers[currentQuestion] === index ? 'checked' : ''} 
                        ${answered[currentQuestion] ? 'disabled' : ''}
                        onchange="selectOption(${index})">
                    <span class="opt-label">${String.fromCharCode(65 + index)})</span>
                    <span>${opt}</span>
                `;
                optionsContainer.appendChild(div);
            });

            // Explanation
            if (answered[currentQuestion]) {
                explanationBox.innerHTML = `<strong>ವಿವರಣೆ:</strong> ${q.explanation}`;
                explanationBox.classList.add('show');
                checkBtn.disabled = true;
                checkBtn.textContent = '✓ ಪರಿಶೀಲಿಸಲಾಗಿದೆ';
            } else {
                explanationBox.classList.remove('show');
                checkBtn.disabled = selectedAnswers[currentQuestion] === null;
                checkBtn.textContent = 'ಉತ್ತರ ಪರಿಶೀಲಿಸಿ';
            }

            // Buttons
            prevBtn.disabled = currentQuestion === 0;
            nextBtn.disabled = currentQuestion === quizData.length - 1;

            // Progress
            progressText.textContent = `ಪ್ರಶ್ನೆ ${currentQuestion + 1} / ${quizData.length}`;
            scoreText.textContent = `ಸ್ಕೋರ್: ${score}`;
            progressBarFill.style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
        }

        function selectOption(index) {
            if (answered[currentQuestion]) return;
            selectedAnswers[currentQuestion] = index;
            checkBtn.disabled = false;
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.toggle('selected', i === index);
            });
            document.querySelectorAll('input[type="radio"]').forEach((radio, i) => {
                radio.checked = (i === index);
            });
        }

        function checkAnswer() {
            if (answered[currentQuestion] || selectedAnswers[currentQuestion] === null) return;

            const q = quizData[currentQuestion];
            const selected = selectedAnswers[currentQuestion];

            answered[currentQuestion] = true;

            if (selected === q.correct) {
                score++;
            }

            renderQuestion();
            scoreText.textContent = `ಸ್ಕೋರ್: ${score}`;
            explanationBox.innerHTML = `<strong>ವಿವರಣೆ:</strong> ${q.explanation}`;
            explanationBox.classList.add('show');
        }

        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                const allAnswered = answered.every(a => a === true);
                if (allAnswered) {
                    showResult();
                } else {
                    const firstUnanswered = answered.findIndex(a => a === false);
                    if (firstUnanswered !== -1) {
                        currentQuestion = firstUnanswered;
                        renderQuestion();
                    } else {
                        showResult();
                    }
                }
            }
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResult() {
            questionContainer.style.display = 'none';
            resultScreen.classList.add('show');
            finalScore.innerHTML = `${score} <span>/ ${quizData.length}</span>`;
            const percentage = (score / quizData.length) * 100;
            if (percentage >= 80) {
                resultMessage.textContent = '🎉 ಅದ್ಭುತ! ನೀವು ಉತ್ತಮ ಸ್ಕೋರ್ ಮಾಡಿದ್ದೀರಿ!';
            } else if (percentage >= 60) {
                resultMessage.textContent = '👍 ಒಳ್ಳೆಯ ಪ್ರಯತ್ನ! ಇನ್ನಷ್ಟು ಸುಧಾರಿಸಬಹುದು.';
            } else if (percentage >= 40) {
                resultMessage.textContent = '📚 ಸಾಧಾರಣ. ಇನ್ನಷ್ಟು ಅಭ್ಯಾಸ ಮಾಡಿ.';
            } else {
                resultMessage.textContent = '💪 ಪರವಾಗಿಲ್ಲ, ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ!';
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = new Array(quizData.length).fill(false);
            selectedAnswers = new Array(quizData.length).fill(null);
            questionContainer.style.display = 'block';
            resultScreen.classList.remove('show');
            renderQuestion();
        }

        // Initialize
        renderQuestion();

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'Enter') {
                if (!answered[currentQuestion] && selectedAnswers[currentQuestion] !== null) {
                    checkAnswer();
                } else {
                    nextQuestion();
                }
            }
        });
    </script>
